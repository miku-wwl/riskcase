name: application-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and PostgreSQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: riskcase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riskcase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__RiskCaseDb: Host=localhost;Port=5432;Database=riskcase_test;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RiskCase.slnx
      - run: dotnet build RiskCase.slnx --no-restore --configuration Release
      - run: dotnet test test/unit/RiskCase.Domain.UnitTests/Domain.UnitTests.csproj --no-build --configuration Release
      - run: dotnet test test/unit/RiskCase.Application.UnitTests/Application.UnitTests.csproj --no-build --configuration Release
      - run: dotnet test test/integration/RiskCase.IntegrationTests/IntegrationTests.csproj --no-build --configuration Release

  frontend:
    name: Frontend and generated client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: dotnet restore backend/RiskCase.Api/RiskCase.Api.csproj
      - run: dotnet build backend/RiskCase.Api/RiskCase.Api.csproj --no-restore --configuration Release
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --exit-code -- frontend/src/generated/riskcase-api.ts

  e2e:
    name: Analyst and supervisor browser workflow
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: riskcase_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riskcase_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__RiskCaseDb: Host=localhost;Port=5432;Database=riskcase_e2e;Username=postgres;Password=postgres
      DOTNET_NOLOGO: "true"
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            test/e2e/package-lock.json
      - run: dotnet restore backend/RiskCase.Api/RiskCase.Api.csproj
      - run: dotnet build backend/RiskCase.Api/RiskCase.Api.csproj --no-restore --configuration Release
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm ci
        working-directory: test/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: test/e2e
      - run: npm test
        working-directory: test/e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riskcase-e2e-output
          path: |
            manual/figures/*.png
            test/e2e/test-results/
            test/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
