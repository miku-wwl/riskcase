<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">每个测试层都应能推翻一种错误承诺</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">生产代码不引用测试屏障；CI 运行测试，但不改变这些证明边界</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 398H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="425" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">只断言 HTTP 失败不够：要独立核对失败后没有部分子记录、审计和回执</text>
<rect x="25" y="110" width="250" height="175" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="39" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">领域 / 应用单元</text>
<text x="39" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">输入：对象与身份抽象</text>
<text x="39" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">证明：状态、资格、作者规则</text>
<text x="39" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">反例：转派后自我复核</text>
<text x="39" y="236" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不能证明 PostgreSQL 锁</text>
<rect x="325" y="110" width="250" height="175" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="339" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">真实 PostgreSQL</text>
<text x="339" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">输入：实际 API 与数据库</text>
<text x="339" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">证明：约束、回滚、MVCC</text>
<text x="339" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">反例：同版两写同时提交</text>
<text x="339" y="236" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">屏障 + 独立 SQL 验证</text>
<rect x="625" y="110" width="250" height="175" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="639" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">真实浏览器</text>
<text x="639" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">输入：应用服务与合成数据</text>
<text x="639" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">证明：草稿、响应次序、恢复</text>
<text x="639" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">反例：ABA 后旧回调清空</text>
<text x="639" y="236" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不能替代数据库原子性</text>
<rect x="100" y="330" width="700" height="50" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="114" y="358" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">断言来自业务保证，而不是测试数量或是否出现绿色日志</text>
</svg>