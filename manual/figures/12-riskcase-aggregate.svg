<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">当前指针可以失效，业务历史不能覆盖</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">聚合边界保护同一案件的调查写入；来源资料通过告警引用</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 398H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="425" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">Version 标识业务动作；BasisVersion 标识被评估的调查事实基础</text>
<rect x="80" y="105" width="740" height="105" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="94" y="133" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">RiskCase：状态 / 经办人 / Version / BasisVersion</text>
<text x="94" y="159" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">CurrentAssessmentId → 当前判断；ReviewedAssessmentId → 本次提交对象</text>
<rect x="25" y="270" width="250" height="110" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="39" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">笔记与关系</text>
<text x="39" y="324" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">Added：事实追加</text>
<text x="39" y="348" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">使当前评估引用失效</text>
<path d="M150 210L150 270" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="325" y="270" width="250" height="110" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="339" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">Assessments</text>
<text x="339" y="324" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">作者 / 理由 / 两种版本</text>
<text x="339" y="348" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不可变历史集合</text>
<path d="M450 210L450 270" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="625" y="270" width="250" height="110" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="639" y="298" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">Decisions</text>
<text x="639" y="324" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">独立复核人 / 理由</text>
<text x="639" y="348" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">引用 AssessmentId</text>
<path d="M750 210L750 270" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
</svg>