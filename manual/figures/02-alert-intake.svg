<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">两把锁解决两种不同的重复</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">API 密钥 → 输入验证；随后才进入下面的事务边界</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 478H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="505" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">所有成功路径最后保存各自回执并 COMMIT；拒绝路径不提交部分业务记录</text>
<rect x="20" y="96" width="860" height="375" rx="12" fill="#fafcfd" stroke="#94a3b8" stroke-dasharray="6 5"/>
<rect x="40" y="115" width="525" height="85" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="54" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">① 开始事务 → scope/key 锁 → 查原回执</text>
<text x="54" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">已有同指纹：返回历史结果，不运行 Handler</text>
<rect x="620" y="115" width="240" height="85" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="634" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">原回执存在</text>
<text x="634" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">内容变化 → 409</text>
<path d="M565 156L620 156" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="45" y="235" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#117c78" font-weight="700">只有新意图进入 Handler</text>
<rect x="40" y="260" width="250" height="140" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="54" y="288" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">② 规范化来源身份</text>
<text x="54" y="314" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">SourceSystem + ID</text>
<text x="54" y="338" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">取得业务身份锁</text>
<text x="54" y="362" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">同来源即使换键仍协调</text>
<rect x="330" y="260" width="235" height="140" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="344" y="288" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">③ 比较 / 核验</text>
<text x="344" y="314" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">已有：比规范化载荷</text>
<text x="344" y="338" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">新告警：校验所有权</text>
<text x="344" y="362" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">信号与交易引用有效</text>
<rect x="610" y="260" width="250" height="140" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="624" y="288" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">④ 保存并回读</text>
<text x="624" y="314" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">新案 + 审计；或已有案</text>
<text x="624" y="338" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">外层新增该键回执</text>
<text x="624" y="362" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">SaveChanges → COMMIT</text>
<path d="M290 330L330 330" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M565 330L610 330" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="45" y="440" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#b84940" font-weight="400">来源内容不同：409 external_alert_payload_conflict；不会覆盖原始观察。</text>
</svg>