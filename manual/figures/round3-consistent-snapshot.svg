<text x="24" y="455" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">独立 GET 用 RR；已有 RC 写事务的详情回读另用父行 FOR SHARE 锁</text>
<text x="160" y="108" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">t1 首次数据读</text>
