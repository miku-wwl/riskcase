<svg xmlns="http://www.w3.org/2000/svg" width="900" height="475" viewBox="0 0 900 475">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">恢复历史成功后，还要读取当前状态</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">K 包含原意图；转派后的当前 v6 不能被历史 v5 覆盖</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 433H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="460" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">每次请求先查当前角色；原键回放不授权新写入</text>
<rect x="25" y="110" width="250" height="115" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="39" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">首次发送 K / If-Match 4</text>
<text x="39" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">先持久化原请求与草稿代次</text>
<text x="39" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">新意图执行评估</text>
<rect x="325" y="110" width="250" height="115" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="339" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">一次 COMMIT → v5</text>
<text x="339" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">评估 + 审计 + 回执 K</text>
<text x="339" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">此后响应丢失，客户端未知</text>
<rect x="625" y="110" width="250" height="115" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="639" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">主管转派 → 当前 v6</text>
<text x="639" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">当前评估投影清空</text>
<text x="639" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">评估历史 A1 仍在</text>
<path d="M275 168L325 168" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M575 168L625 168" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="25" y="290" width="250" height="105" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="39" y="318" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">刷新后沿原键恢复</text>
<text x="39" y="344" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">原正文 + If-Match 4</text>
<text x="39" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不换键、不改前置条件</text>
<rect x="325" y="290" width="250" height="105" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="339" y="318" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">读取回执 K → 历史 v5</text>
<text x="339" y="344" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不再次调用 Handler</text>
<text x="339" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不再新增评估和审计</text>
<rect x="625" y="290" width="250" height="105" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="639" y="318" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">React 协调并 GET</text>
<text x="639" y="344" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">保留较新 v6 缓存</text>
<text x="639" y="368" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">草稿按代次保护</text>
<path d="M275 342L325 342" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M575 342L625 342" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M450 225V290" fill="none" stroke="#7255a5" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
</svg>