<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">历史成功可以恢复，当前状态必须重新确认</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">回执回答“这次操作当时是否成功”，不承诺“这是现在的案件状态”</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">实时角色校验 → 原回执 vN → 缓存取较新版本 → GET 当前状态；不再次执行业务写入</text>
<text x="30" y="140" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">浏览器</text>
<path d="M165 135H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<text x="30" y="240" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">服务端</text>
<path d="M165 235H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<text x="30" y="340" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">PostgreSQL</text>
<path d="M165 335H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<rect x="180" y="99" width="200" height="76" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="195" y="127" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">原意图 K / vN−1</text>
<text x="195" y="153" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">内容和前置条件固定</text>
<rect x="430" y="199" width="180" height="76" rx="10" fill="#fff0ed" stroke="#b84940" stroke-width="1.5"/>
<text x="445" y="227" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#b84940" font-weight="700">响应丢失</text>
<text x="445" y="253" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">客户端结果未知</text>
<rect x="180" y="299" width="200" height="105" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="195" y="327" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">一次 COMMIT</text>
<text x="195" y="353" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">操作成功 → vN</text>
<text x="195" y="375" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">业务 + 审计 + 回执 K</text>
<rect x="650" y="99" width="215" height="105" rx="10" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="665" y="127" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#7255a5" font-weight="700">恢复 K 后再核对</text>
<text x="665" y="153" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">旧快照不能覆盖 vN+1</text>
<text x="665" y="175" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">刷新得到当前确认状态</text>
<rect x="650" y="299" width="215" height="105" rx="10" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="665" y="327" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#a36c13" font-weight="700">后来已到 vN+1</text>
<text x="665" y="353" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">K 仍保存历史成功 vN</text>
<text x="665" y="375" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">不重复插入业务记录</text>
<path d="M280 175L280 299" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M380 335L430 275" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M610 235L650 204" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M755 299L755 204" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
</svg>