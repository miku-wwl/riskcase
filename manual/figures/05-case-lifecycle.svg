<text x="365" y="346" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">经办人或主管显式退回</text>
<text x="65" y="410" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#117c78" font-weight="700">新评估确认当前基础 → 再次提交复核 → 另一位合格主管决定</text>
