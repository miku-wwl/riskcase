<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">状态同时约束事实、评估与责任人</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">复核是一份已确认调查基础的冻结期；显式退回后必须重新评估</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">Resolved 终止本系统调查；监测、升级、AML 转交属于下游人工流程</text>
<rect x="30" y="130" width="180" height="118" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
