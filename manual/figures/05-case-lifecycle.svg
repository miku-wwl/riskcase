<text x="45" y="184" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">分派 → 开始调查</text>
<rect x="245" y="130" width="180" height="118" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="260" y="158" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">Investigating</text>
<text x="260" y="184" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">笔记 / 关系可追加</text>
<text x="260" y="206" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">变更使当前评估失效</text>
<rect x="465" y="130" width="180" height="118" rx="10" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="480" y="158" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#7255a5" font-weight="700">Reviewing</text>
<text x="480" y="184" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">事实 / 评估 / 分派冻结</text>
<text x="480" y="206" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">绑定评估 ID</text>
<rect x="695" y="130" width="180" height="118" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="710" y="158" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">Resolved</text>
<text x="710" y="184" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">决定与历史只读</text>
<path d="M210 180L245 180" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M425 180L465 180" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M645 180L695 180" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M550 248L550 320" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M550 320L335 320" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
