<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">MVCC 可见性与业务版本条件各有职责</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">Read Committed 下的两个请求：读取同一 v8，再竞争写入</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">图示为 RiskCase 的条件更新；不是 PostgreSQL 对所有 UPDATE 的默认防覆盖保证</text>
<text x="30" y="165" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">事务 T1</text>
<path d="M165 160H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<text x="30" y="300" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">事务 T2</text>
<path d="M165 295H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<rect x="180" y="113" width="175" height="93" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="195" y="141" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">读到 v8</text>
<text x="195" y="167" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">原始并发令牌</text>
<rect x="430" y="113" width="175" height="93" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="445" y="141" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">写入 v9</text>
<text x="445" y="167" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">WHERE Version=8</text>
<rect x="680" y="113" width="170" height="93" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="695" y="141" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">COMMIT</text>
<text x="695" y="167" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">审计与回执一起</text>
<rect x="180" y="248" width="175" height="93" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="195" y="276" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">读到 v8</text>
<text x="195" y="302" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">另一个请求快照</text>
<rect x="610" y="248" width="240" height="93" rx="10" fill="#fff0ed" stroke="#b84940" stroke-width="1.5"/>
<text x="625" y="276" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#b84940" font-weight="700">旧条件更新 0 行</text>
<text x="625" y="302" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">WHERE Version=8 → 412</text>
<path d="M355 160L430 160" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M605 160L680 160" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M355 295L610 295" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M765 206L765 248" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="180" y="407" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">EF 可能先插入子记录；若版本冲突，外层事务仍回滚这些 INSERT。</text>
</svg>