<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">把集合乘积改成固定条数的读取</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">小型合成案件：10 笔交易 / 3 个信号 / 5 条笔记 / 3 条关系 / 2 次评估</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">9 条详情 SQL 的一致性由事务边界保障；集合仍完整返回，数据量继续按记录总数增长</text>
<rect x="30" y="115" width="395" height="152" rx="10" fill="#fff0ed" stroke="#b84940" stroke-width="1.5"/>
<text x="45" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#b84940" font-weight="700">单查询加载（原实现）</text>
<text x="45" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">交易 × 信号 × 笔记 × 关系 × 评估</text>
<text x="45" y="191" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">10 × 3 × 5 × 3 × 2 = 900 行</text>
<text x="45" y="213" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">同一主记录反复携带到客户端</text>
<text x="45" y="235" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">另查 1 行审计：实际共 901 行</text>
<rect x="475" y="115" width="390" height="152" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="490" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">分拆加载（当前实现）</text>
<text x="490" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">主记录 + 7 个集合查询 + 审计</text>
<text x="490" y="191" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">集合：交易 / 信号 / 笔记 / 关系</text>
<text x="490" y="213" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">决定 / 完整评估 / 旧作者参与记录</text>
<text x="490" y="235" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">小型实际根输出行数之和：25</text>
<path d="M425 190L475 190" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="30" y="315" width="395" height="105" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="45" y="343" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">20 次端点中位数 / p95</text>
<text x="45" y="369" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">原实现：146.1 / 179.3 ms</text>
<text x="45" y="391" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">当前实现：25.5 / 43.1 ms</text>
<rect x="475" y="315" width="390" height="105" rx="10" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="490" y="343" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#a36c13" font-weight="700">测量条件与代价</text>
<text x="490" y="369" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">本机 PostgreSQL 17.12 · Release</text>
<text x="490" y="391" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">TestServer 含认证；不含网络延迟</text>
</svg>