<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">持久化关系与概念节点不是同一层</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">Customer / Account / RiskTransaction 是实体；对手方引用来自交易字段</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 398H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="425" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">实线表示实际外键或值来源；下方说明案件围绕来源告警组织调查</text>
<rect x="25" y="120" width="190" height="135" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="39" y="148" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">Customer</text>
<text x="39" y="174" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">稳定客户 ID</text>
<text x="39" y="198" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">不等于告警主体</text>
<rect x="245" y="120" width="190" height="135" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="259" y="148" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">Account</text>
<text x="259" y="174" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">CustomerId 外键</text>
<text x="259" y="198" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">掩码账号，无可写余额</text>
<rect x="465" y="120" width="190" height="135" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="479" y="148" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">RiskTransaction</text>
<text x="479" y="174" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">AccountId 外键</text>
<text x="479" y="198" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">金额 / 时间 / 引用</text>
<rect x="685" y="120" width="190" height="135" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="699" y="148" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">对手方节点</text>
<text x="699" y="174" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">Counterparty</text>
<text x="699" y="198" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">Reference</text>
<text x="699" y="222" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">来自交易中的值</text>
<path d="M245 185L215 185" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M465 185L435 185" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M655 185L685 185" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="100" y="302" width="700" height="68" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="114" y="330" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">RiskCase → RiskAlert → 主客户/主账户与相关观察</text>
</svg>