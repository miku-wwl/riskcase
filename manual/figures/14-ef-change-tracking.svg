<text x="45" y="379" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">INSERT 子记录 + INSERT 审计 + UPDATE 案件版本 + 幂等回执，同一事务成功或回滚</text>
