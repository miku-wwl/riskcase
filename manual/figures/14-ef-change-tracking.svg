<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">EF 状态负责生成 SQL；数据库约束与外层事务决定能否作为一次完整事实提交</text>
