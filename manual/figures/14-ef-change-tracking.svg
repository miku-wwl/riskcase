<text x="500" y="148" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">只读案件详情</text>
<text x="500" y="174" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">AsNoTracking + AsSplitQuery</text>
<text x="500" y="196" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">独立 GET：REPEATABLE READ</text>
