<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">从业务身份映射到固定的图形视图</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">这是展示映射；当前实现没有节点详情面板或逐边 URL 跳转</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 398H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="425" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">节点不可拖动、不可新连线；缩放、平移与选中不改变持久化事实</text>
<rect x="25" y="110" width="250" height="145" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="39" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">API 合同</text>
<text x="39" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">graphNodes: id/type/detail</text>
<text x="39" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">graphEdges: source/target</text>
<text x="39" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">rationale 保留手工理由</text>
<rect x="325" y="110" width="250" height="145" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="339" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">RiskGraph useMemo</text>
<text x="339" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">type → 固定列位置</text>
<text x="339" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">同类计数 → 固定行位置</text>
<text x="339" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">真实 ID 传给节点与边</text>
<rect x="625" y="110" width="250" height="145" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="639" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">React Flow</text>
<text x="639" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">节点类型标签 + 摘要</text>
<text x="639" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">交易边与紫色手工边</text>
<text x="639" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">draggable:false</text>
<path d="M275 180L325 180" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M575 180L625 180" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="100" y="310" width="700" height="65" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="114" y="338" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">完整交易事实在调查标签页；邻近位置不等于共同控制</text>
</svg>