<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">一次有理由的退回开始新的调查基础</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">返回不是删除评估；它使当前评估和复核引用失效</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">原因去除首尾空白后为 20-1500 个 Unicode 字符；理由、操作者、时间与 vN+1 一起提交</text>
<rect x="30" y="125" width="245" height="115" rx="10" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="45" y="153" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#7255a5" font-weight="700">Reviewing · vN</text>
<text x="45" y="179" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">调查事实已冻结</text>
<text x="45" y="201" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">当前提交指向评估 A1</text>
<rect x="330" y="125" width="245" height="115" rx="10" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="345" y="153" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#a36c13" font-weight="700">确认退回原因</text>
<text x="345" y="179" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">具体核验缺口与待办</text>
<text x="345" y="201" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">If-Match + 原幂等键</text>
<rect x="630" y="125" width="240" height="115" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="645" y="153" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">Investigating · vN+1</text>
<text x="645" y="179" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">当前评估引用清空</text>
<text x="645" y="201" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">新 BasisVersion=vN+1</text>
<path d="M275 180L330 180" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M575 180L630 180" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="30" y="315" width="395" height="105" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="45" y="343" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">不可变审计 InvestigationResumed</text>
<text x="45" y="369" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">Reason / ActorId / OccurredAt / 版本</text>
<text x="45" y="391" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">旧评估 A1 仍保留完整历史</text>
<rect x="485" y="315" width="385" height="105" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="500" y="343" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">重新评估 A2 → 再提交复核</text>
<text x="500" y="369" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">明确新依据，ReviewedAssessmentId=A2</text>
<text x="500" y="391" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">主管不能直接沿用已失效的 A1</text>
<path d="M450 240L450 285" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M450 285L225 315" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M750 240L750 315" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
</svg>