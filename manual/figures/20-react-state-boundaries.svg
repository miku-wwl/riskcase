<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">用三个不同版本解释 A → B → A</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">文本相等不代表编辑意图相同；r1、r2、r3 为编辑代次示意</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">只有案件键、用户键、本地代次与跨标签页持久化代次均匹配时，成功回调才清空草稿</text>
<text x="30" y="160" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">本地编辑</text>
<path d="M165 155H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<text x="30" y="305" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#22364f" font-weight="700">网络请求</text>
<path d="M165 300H865" stroke="#dbe5ea" stroke-dasharray="5 4"/>
<rect x="180" y="108" width="205" height="98" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="195" y="136" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">A / r1</text>
<text x="195" y="162" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">提交时捕获快照</text>
<rect x="420" y="108" width="205" height="98" rx="10" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="435" y="136" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#a36c13" font-weight="700">B / r2</text>
<text x="435" y="162" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">用户继续修改</text>
<rect x="660" y="108" width="205" height="98" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="675" y="136" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">A / r3</text>
<text x="675" y="162" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">内容回到 A，代次已变</text>
<path d="M385 155L420 155" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M625 155L660 155" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="180" y="253" width="205" height="100" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="195" y="281" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">提交 M1</text>
<text x="195" y="307" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">内容 A · 捕获 r1</text>
<text x="195" y="329" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">固定案件与服务端版本</text>
<rect x="660" y="253" width="205" height="100" rx="10" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="675" y="281" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#7255a5" font-weight="700">M1 成功返回</text>
<text x="675" y="307" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">r1 ≠ 当前 r3</text>
<text x="675" y="329" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">保留当前草稿 A</text>
<path d="M280 206L280 253" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M385 300L660 300" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<text x="492.5" y="291.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="12" fill="#526273" font-weight="400">延迟响应</text>
<text x="180" y="414" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">案件缓存另用服务器 Version 比较；草稿代次和服务器版本不能互相替代。</text>
</svg>