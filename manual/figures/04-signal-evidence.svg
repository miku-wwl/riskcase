<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">同一事实可以有规则解释，也可以有反证</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">核对交易引用后再判断；分数不是每个调查阶段的必经节点</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 398H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="425" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">信号不能证明欺诈或洗钱；本系统没有重新执行一个上游风险规则引擎</text>
<rect x="25" y="110" width="250" height="140" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="39" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">观察交易</text>
<text x="39" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">TX-1 … TX-4</text>
<text x="39" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">时间 / 金额 / 对手方</text>
<text x="39" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">先排除错误及重复来源</text>
<rect x="325" y="110" width="250" height="140" rx="9" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="339" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a36c13" font-weight="700">可解释信号</text>
<text x="339" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">代码 + 理由 + 引用</text>
<text x="339" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">例如：短时多次转出</text>
<text x="339" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">可被事实反驳</text>
<rect x="625" y="110" width="250" height="140" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="639" y="138" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">人员调查与评估</text>
<text x="639" y="164" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">结合背景及反证</text>
<text x="639" y="188" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">记录完整理由与作者</text>
<text x="639" y="212" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">再提交独立复核</text>
<path d="M275 180L325 180" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M575 180L625 180" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<rect x="100" y="300" width="700" height="70" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="114" y="328" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">可选分数 87 → 队列优先级；不能直接推出最终处置</text>
</svg>