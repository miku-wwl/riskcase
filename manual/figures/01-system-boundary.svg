<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">一条告警跨越三种责任</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">交接的是观察和判断；处置记录有明确的系统边界</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 398H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="425" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">87 分用于安排核查顺序；来源事实、人员判断与外部行动分别负责</text>
<rect x="25" y="115" width="250" height="155" rx="9" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="39" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#22364f" font-weight="700">上游监测</text>
<text x="39" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">输入：交易观察</text>
<text x="39" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">输出：有来源的告警</text>
<text x="39" y="217" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">信号 + 引用 + 可选分数</text>
<rect x="325" y="115" width="250" height="155" rx="9" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="339" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#117c78" font-weight="700">RiskCase 调查</text>
<text x="339" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">经办人：事实与评估</text>
<text x="339" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">独立主管：复核与决定</text>
<text x="339" y="217" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">保存作者、依据及版本</text>
<rect x="625" y="115" width="250" height="155" rx="9" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="639" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#7255a5" font-weight="700">下游人工团队</text>
<text x="639" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">读取升级 / 监测建议</text>
<text x="639" y="193" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">是否接收、怎样行动</text>
<text x="639" y="217" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">本应用没有执行回执</text>
