<svg xmlns="http://www.w3.org/2000/svg" width="900" height="485" viewBox="0 0 900 485">
<rect width="900" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="24" y="32" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#22364f" font-weight="700">进入按注册顺序，成功返回沿相反方向</text>
<text x="24" y="61" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">Logging 是先执行的 RequestPreProcessor，不是下面的自定义行为</text>
<path d="M24 79H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<path d="M24 443H876" fill="none" stroke="#dbe5ea" stroke-width="1.7"/>
<text x="24" y="470" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="15" fill="#526273" font-weight="400">Performance 不包住前面的授权/验证；幂等存储而非 MediatR 自动拥有事务</text>
<rect x="30" y="102" width="790" height="43" rx="6" fill="#eef3f9"/>
<text x="43" y="130" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#22364f" font-weight="700">UnhandledException</text>
<text x="290" y="130" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">包住后续自定义行为；记录并重新抛出</text>
<rect x="30" y="155" width="790" height="43" rx="6" fill="#f1edfb"/>
<text x="43" y="183" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#7255a5" font-weight="700">Authorization</text>
<text x="290" y="183" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">查询当前角色与锁定状态；失败就停止</text>
<rect x="30" y="208" width="790" height="43" rx="6" fill="#fff4df"/>
<text x="43" y="236" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#a36c13" font-weight="700">Validation</text>
<text x="290" y="236" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">验证字段与范围；失败不进入业务事务</text>
<rect x="30" y="261" width="790" height="43" rx="6" fill="#eef3f9"/>
<text x="43" y="289" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#22364f" font-weight="700">Performance</text>
<text x="290" y="289" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">从 next 开始计时；成功返回后检查慢请求</text>
<rect x="30" y="314" width="790" height="43" rx="6" fill="#e8f5f3"/>
<text x="43" y="342" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#117c78" font-weight="700">Idempotency</text>
<text x="290" y="342" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">新意图：事务/锁/回执；已有：历史回放</text>
<rect x="30" y="367" width="790" height="43" rx="6" fill="#e8f5f3"/>
<text x="43" y="395" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#117c78" font-weight="700">Handler + Domain</text>
<text x="290" y="395" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#526273" font-weight="400">协调持久化 / 执行业务不变量</text>
<path d="M850 110L850 405" fill="none" stroke="#64748b" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="834" y="432" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#526273" font-weight="400">进入</text>
</svg>