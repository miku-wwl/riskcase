<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<rect width="900" height="500" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b"/></marker></defs>
<text x="30" y="36" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#22364f" font-weight="700">历史作者可恢复，旧理由不能补造</text>
<text x="30" y="63" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">审计身份索引与完整评估记录承担不同职责</text>
<path d="M30 79H870 M30 457H870" stroke="#dbe5ea"/>
<text x="30" y="482" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="13" fill="#526273" font-weight="400">已知作者参与过任一评估 → 禁止最终复核；任一身份缺口 → 无法证明独立性</text>
<rect x="30" y="115" width="255" height="126" rx="10" fill="#eef3f9" stroke="#22364f" stroke-width="1.5"/>
<text x="45" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#22364f" font-weight="700">旧 AssessmentRecorded</text>
<text x="45" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">v4 · ActorId=S · High</text>
<text x="45" y="191" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">v6 · ActorId=A · Low</text>
<text x="45" y="213" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">早期完整理由已经覆盖</text>
<rect x="335" y="115" width="255" height="126" rx="10" fill="#e8f5f3" stroke="#117c78" stroke-width="1.5"/>
<text x="350" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#117c78" font-weight="700">不可变参与记录</text>
<text x="350" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">CaseId / CaseVersion / 作者</text>
<text x="350" y="191" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">SourceAuditId 保留来源</text>
<text x="350" y="213" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">不伪造 RiskAssessment</text>
<rect x="640" y="115" width="225" height="126" rx="10" fill="#f1edfb" stroke="#7255a5" stroke-width="1.5"/>
<text x="655" y="143" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#7255a5" font-weight="700">最终复核人 R</text>
<text x="655" y="169" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">检查所有新旧作者</text>
<text x="655" y="191" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">R 不能是 S 或 A</text>
<text x="655" y="213" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">经办人变化不清除历史</text>
<path d="M285 178L335 178" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<path d="M590 178L640 178" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
<rect x="30" y="300" width="400" height="114" rx="10" fill="#fff4df" stroke="#a36c13" stroke-width="1.5"/>
<text x="45" y="328" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#a36c13" font-weight="700">保留的最后一次评估快照</text>
<text x="45" y="354" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">IsLegacy=true · 原等级 / 理由 / 时间</text>
<text x="45" y="376" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">作者索引独立保存可核实的审计身份</text>
<rect x="475" y="300" width="390" height="114" rx="10" fill="#fff0ed" stroke="#b84940" stroke-width="1.5"/>
<text x="490" y="328" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#b84940" font-weight="700">审计或身份确实缺失</text>
<text x="490" y="354" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">审计 ID / 评估快照 ID → 作者 NULL</text>
<text x="490" y="376" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#526273" font-weight="400">保持未知并阻止结案，不猜当前负责人</text>
</svg>